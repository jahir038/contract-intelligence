[project]
name = "contract-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jahir", email = "iamjahirhussain@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "fastapi>=0.161.1",
    "google>=3.0.0",
    "google-genai>=2.33.0",
    "pandas>=3.1.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
contract-intelligence = "contract_intelligence:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
